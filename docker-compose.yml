version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000

  ui:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    command: >
      sh -c "pip install streamlit requests --quiet &&
             streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - api
